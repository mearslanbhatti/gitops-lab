apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.17.0
    helm:
      valuesObject:
        grafana:
          adminPassword: admin          # lab only; never do this for real
        prometheus:
          prometheusSpec:
            # let Prometheus discover ServiceMonitors from any chart, not just this one
            serviceMonitorSelectorNilUsesHelmValues: false
        # minikube-specific: these control-plane targets aren't reachable and cause noisy alerts
        kubeEtcd: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeProxy: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true            # the chart's CRDs are too large for client-side apply